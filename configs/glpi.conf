# /etc/apache2/sites-available/glpi.conf
# GLPI 11 virtual host. DocumentRoot points at public/ so only the front controller
# and static assets are web-reachable; config (/etc/glpi) and data (/var/lib/glpi) live outside it.
<VirtualHost *:80>
    ServerName glpi.corp.local

    DocumentRoot /var/www/glpi/public
    ErrorLog ${APACHE_LOG_DIR}/glpi_error.log
    CustomLog ${APACHE_LOG_DIR}/glpi_access.log combined

    <Directory /var/www/glpi/public>
        Require all granted

        RewriteEngine On

        # Ensure authorization headers are passed to PHP (API, CalDAV).
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # Redirect all requests to the GLPI router, unless the file exists.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
</VirtualHost>
